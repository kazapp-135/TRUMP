<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>トランプ精算システム</title>
    <style>
        :root { --bg: #000000; --text: #FFD700; --border: #FFD700; --btn-bg: #111111; --danger: #880000; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Arial Black', Impact, sans-serif; margin: 0; padding: 15px; box-sizing: border-box; }
        
        .section-box { border: 3px solid var(--border); padding: 15px; margin-bottom: 20px; }
        button { display: block; width: 100%; height: 70px; background: var(--btn-bg); color: var(--text); border: 3px solid var(--border); font-size: 1.2rem; margin-bottom: 10px; cursor: pointer; font-weight: bold; }
        button:active { background: #333; }
        
        input { height: 60px; width: 100%; margin-bottom: 10px; background: #222; color: #fff; border: 2px solid #FFD700; font-size: 1.2rem; padding: 10px; box-sizing: border-box; }
        
        .mode-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .active-mode { background: var(--border) !important; color: #000 !important; }
        
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: center; }
        .hidden { display: none; }
        #status-bar { font-size: 1.5rem; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="mode-nav">
        <button id="btn-input" class="active-mode" onclick="setMode('input')">結果入力</button>
        <button id="btn-table" onclick="setMode('table')">順位表・参加者追加</button>
    </div>

    <div id="input-mode">
        <div class="section-box">
            <div id="status-bar">準備中...</div>
        </div>
        <div id="input-area"></div>
    </div>

    <div id="table-mode" class="hidden">
        <div class="section-box">
            <h3>+ プレイヤー追加</h3>
            <input type="text" id="new-player-name" placeholder="名前を入力">
            <button onclick="addPlayer()">追加する</button>
        </div>
        <table id="rank-table"></table>
        <button onclick="calculateSettlement()">精算結果を表示</button>
        <div id="settlement-result" style="margin: 20px 0; font-size: 1.2rem; border-top: 2px solid #FFD700; padding-top: 10px;"></div>
        <button class="danger" onclick="resetData()">全データリセット</button>
    </div>

    <script>
        const POINTS = [20, 10, 10];
        let players = JSON.parse(localStorage.getItem('players') || '[]');
        let gameStep = 'select';
        let selectedPlayers = [];
        let ranking = [];

        function save() { localStorage.setItem('players', JSON.stringify(players)); }

        function setMode(mode) {
            document.getElementById('input-mode').classList.toggle('hidden', mode !== 'input');
            document.getElementById('table-mode').classList.toggle('hidden', mode !== 'table');
            document.getElementById('btn-input').classList.toggle('active-mode', mode === 'input');
            document.getElementById('btn-table').classList.toggle('active-mode', mode === 'table');
            if (mode === 'table') renderTable(); else renderInput();
        }

        function addPlayer() {
            const input = document.getElementById('new-player-name');
            if (!input.value) return;
            players.push({id: Date.now(), name: input.value, total: 0, playCount: 0, absentBonus: 0});
            input.value = '';
            save();
            renderTable();
        }

        function renderInput() {
            const area = document.getElementById('input-area');
            const status = document.getElementById('status-bar');
            area.innerHTML = '';
            
            if (gameStep === 'select') {
                status.innerText = "参加者を選んでください";
                players.forEach(p => {
                    const btn = document.createElement('button');
                    const isSelected = selectedPlayers.find(s => s.id === p.id);
                    btn.innerText = (isSelected ? "● " : "○ ") + p.name;
                    btn.style.background = isSelected ? "#333" : "#111";
                    btn.onclick = () => {
                        if (isSelected) selectedPlayers = selectedPlayers.filter(s => s.id !== p.id);
                        else selectedPlayers.push(p);
                        renderInput();
                    };
                    area.appendChild(btn);
                });
                if(selectedPlayers.length >= 2) {
                    const startBtn = document.createElement('button');
                    startBtn.innerText = "決定：順位を入力";
                    startBtn.style.borderColor = "#fff";
                    startBtn.onclick = () => { gameStep = 'ranking'; ranking = []; renderInput(); };
                    area.appendChild(startBtn);
                }
            } else {
                status.innerText = `${ranking.length + 1}位を選択`;
                selectedPlayers.forEach(p => {
                    if (!ranking.find(r => r.id === p.id)) {
                        const btn = document.createElement('button');
                        btn.innerText = p.name;
                        btn.onclick = () => {
                            ranking.push(p);
                            if (ranking.length === selectedPlayers.length) finishGame();
                            else renderInput();
                        };
                        area.appendChild(btn);
                    }
                });
            }
        }

        function finishGame() {
            const avg = 40 / selectedPlayers.length;
            players.forEach(p => {
                const isParticipated = selectedPlayers.find(s => s.id === p.id);
                if (isParticipated) {
                    const rankIdx = ranking.findIndex(r => r.id === p.id);
                    p.total += (rankIdx >= 0 && rankIdx < POINTS.length) ? POINTS[rankIdx] : 0;
                } else {
                    p.total += avg;
                    p.absentBonus += avg;
                }
                p.playCount += 1;
            });
            save();
            alert("結果を保存しました！");
            gameStep = 'select'; selectedPlayers = []; ranking = [];
            setMode('table');
        }

        function renderTable() {
            const tbl = document.getElementById('rank-table');
            const sorted = [...players].sort((a,b) => b.total - a.total);
            tbl.innerHTML = "<tr><th>順位</th><th>名前</th><th>pt</th></tr>";
            sorted.forEach((p, i) => {
                tbl.innerHTML += `<tr><td>${i+1}位</td><td>${p.name}</td><td>${p.total.toFixed(1)}</td></tr>`;
            });
        }

        function calculateSettlement() {
            if(players.length < 2) return;
            const avg = players.reduce((s, p) => s + p.total, 0) / players.length;
            let debtors = players.filter(p => p.total < avg).map(p => ({name: p.name, diff: avg - p.total}));
            let creditors = players.filter(p => p.total >= avg).map(p => ({name: p.name, diff: p.total - avg}));
            
            let html = "<strong>精算リスト:</strong><br>";
            debtors.forEach(d => {
                creditors.forEach(c => {
                    if (d.diff > 0.01 && c.diff > 0.01) {
                        const amt = Math.min(d.diff, c.diff);
                        html += `<div>${d.name} → ${c.name} : ${amt.toFixed(1)}pt</div>`;
                        d.diff -= amt; c.diff -= amt;
                    }
                });
            });
            document.getElementById('settlement-result').innerHTML = html || "精算不要";
        }

        function resetData() { if(confirm("全データを削除しますか？")) { localStorage.clear(); location.reload(); } }
        
        setMode('input');
    </script>
</body>
</html>
