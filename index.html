<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TRUMP SYSTEM</title>
    <style>
        body { background: #000; color: #FFD700; font-family: sans-serif; margin: 0; padding: 20px; }
        .big-btn { width: 100%; padding: 20px; background: #FFD700; border: none; font-weight: bold; margin-bottom: 10px; }
        .reset-btn { background: #880000; color: #fff; }
        .player-check { padding: 15px; border: 1px solid #FFD700; margin-bottom: 5px; display: flex; align-items: center; }
    </style>
</head>
<body>
    <h1>TRUMP SYSTEM</h1>
    <div id="setup">
        <input type="text" id="pName" style="width:70%; padding:10px;">
        <button onclick="addPlayer()">追加</button>
    </div>

    <div id="main">
        <h3>1. 今回の参加者（チェック）</h3>
        <div id="checkList"></div>
        <button class="big-btn" onclick="startRanking()">順位入力へ進む</button>
    </div>

    <div id="rankArea" style="display:none;">
        <h3 id="rankMsg"></h3>
        <div id="rankList"></div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('data')) || [];
        let currentMatch = [];
        let rank = 0;
        const POINTS = [20, 10, 10, 0];

        function addPlayer() {
            let n = document.getElementById('pName').value;
            if(n) { players.push({name:n, total:0, count:0}); localStorage.setItem('data', JSON.stringify(players)); location.reload(); }
        }

        function startRanking() {
            currentMatch = players.filter((_,i) => document.getElementById('check'+i).checked);
            if(currentMatch.length < 2) return alert("2人以上選んでください");
            document.getElementById('main').style.display = 'none';
            document.getElementById('rankArea').style.display = 'block';
            renderRank();
        }

        function renderRank() {
            document.getElementById('rankMsg').innerText = `${rank + 1}位のプレイヤーを選択`;
            document.getElementById('rankList').innerHTML = currentMatch.map((p,i) => 
                `<button class="big-btn" onclick="setRank(${i})">${p.name}</button>`).join('');
        }

        function setRank(idx) {
            let p = players.find(x => x.name === currentMatch[idx].name);
            p.total += (POINTS[rank] || 0);
            p.count += 1;
            currentMatch.splice(idx, 1);
            rank++;
            if(currentMatch.length === 0) {
                alert("集計完了");
                localStorage.setItem('data', JSON.stringify(players));
                location.reload();
            } else { renderRank(); }
        }

        function resetAll() { if(confirm("全データ消去しますか？")) { localStorage.clear(); location.reload(); } }

        function renderPlayers() {
            document.getElementById('checkList').innerHTML = players.map((p,i) => 
                `<div class="player-check"><input type="checkbox" id="check${i}"> ${p.name}</div>`).join('');
        }
        
        renderPlayers();
    </script>
    <button class="big-btn reset-btn" onclick="resetAll()">全データリセット</button>
</body>
</html>
