<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>トランプ精算システム</title>
    <style>
        :root { --bg: #000000; --text: #FFD700; --border: #FFD700; --btn-bg: #111111; --danger: #880000; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Arial Black', Impact, sans-serif; margin: 0; padding: 10px; box-sizing: border-box; user-select: none; }
        button { display: block; width: 100%; height: 70px; background: var(--btn-bg); color: var(--text); border: 3px solid var(--border); font-size: 1.2rem; margin-bottom: 10px; cursor: pointer; font-weight: bold; }
        .danger { background: var(--danger); }
        .mode-container { display: flex; gap: 5px; }
        .hidden { display: none; }
        #status-bar { border: 2px solid var(--border); padding: 10px; margin: 10px 0; font-size: 1.1rem; min-height: 50px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { border: 1px solid var(--border); padding: 5px; text-align: center; }
        input { height: 50px; width: 100%; margin-bottom: 10px; background: #000; color: #fff; border: 2px solid #FFD700; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="mode-container">
        <button onclick="setMode('input')">INPUT MODE</button>
        <button onclick="setMode('table')">TABLE MODE</button>
    </div>

    <div id="input-mode">
        <div id="status-bar">準備中</div>
        <div id="input-area"></div>
    </div>

    <div id="table-mode" class="hidden">
        <input type="text" id="new-player-name" placeholder="名前を入力...">
        <button onclick="addPlayer()">プレイヤーを追加</button>
        <table id="rank-table"></table>
        <button onclick="calculateSettlement()">精算計算</button>
        <div id="settlement-result" style="margin: 10px 0;"></div>
        <button class="danger" onclick="resetData()">全データ削除</button>
    </div>

    <div style="margin-top:20px; border:1px solid #FFD700; padding:10px;">
        <h3>期待値補正とは？</h3>
        <p>参加しなかったプレイヤー(休憩中)には、参加者の平均ポイントを加算します。長期的に公平な比較が可能です。</p>
    </div>

    <script>
        const POINTS = [20, 10, 10];
        let players = JSON.parse(localStorage.getItem('players') || '[]');
        let gameStep = 'select';
        let selectedPlayers = [];
        let ranking = [];

        function save() { localStorage.setItem('players', JSON.stringify(players)); }

        function addPlayer() {
            const name = document.getElementById('new-player-name').value;
            if (!name) return;
            players.push({name, total:0, playCount:0, absentBonus:0});
            document.getElementById('new-player-name').value = '';
            save();
            renderTable();
        }

        function setMode(mode) {
            document.getElementById('input-mode').classList.toggle('hidden', mode !== 'input');
            document.getElementById('table-mode').classList.toggle('hidden', mode !== 'table');
            if (mode === 'table') renderTable(); else renderInput();
        }

        function renderInput() {
            const area = document.getElementById('input-area');
            area.innerHTML = '';
            if (gameStep === 'select') {
                document.getElementById('status-bar').innerText = "参加者を選択 (未選択は休憩扱い)";
                players.forEach((p, i) => {
                    const btn = document.createElement('button');
                    btn.innerText = p.name;
                    btn.onclick = () => {
                        if (selectedPlayers.includes(p)) {
                            selectedPlayers = selectedPlayers.filter(sp => sp !== p);
                            btn.style.background = "#111";
                        } else {
                            selectedPlayers.push(p);
                            btn.style.background = "#333";
                        }
                    };
                    area.appendChild(btn);
                });
                if(selectedPlayers.length >= 2) {
                    const startBtn = document.createElement('button');
                    startBtn.innerText = "ゲーム開始";
                    startBtn.style.borderColor = "white";
                    startBtn.onclick = () => { gameStep = 'input'; renderInput(); };
                    area.appendChild(startBtn);
                }
            } else {
                const rank = ranking.length + 1;
                document.getElementById('status-bar').innerText = `${rank}位を選択`;
                selectedPlayers.forEach(p => {
                    if (!ranking.includes(p)) {
                        const btn = document.createElement('button');
                        btn.innerText = p.name;
                        btn.onclick = () => {
                            ranking.push(p);
                            if (ranking.length === selectedPlayers.length) finishGame();
                            else renderInput();
                        };
                        area.appendChild(btn);
                    }
                });
            }
        }

        function finishGame() {
            const avg = 40 / selectedPlayers.length;
            players.forEach(p => {
                if (selectedPlayers.includes(p)) {
                    const idx = ranking.indexOf(p);
                    p.total += (idx < POINTS.length ? POINTS[idx] : 0);
                    p.playCount += 1;
                } else {
                    p.total += avg;
                    p.absentBonus += avg;
                }
            });
            save();
            alert("結果を保存しました");
            gameStep = 'select'; ranking = []; selectedPlayers = [];
            renderInput();
        }

        function renderTable() {
            const tbl = document.getElementById('rank-table');
            const sorted = [...players].sort((a,b) => b.total - a.total);
            tbl.innerHTML = "<tr><th>順位</th><th>名</th><th>pt</th><th>回</th></tr>";
            sorted.forEach((p, i) => {
                tbl.innerHTML += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.total.toFixed(1)}</td><td>${p.playCount}</td></tr>`;
            });
        }

        function calculateSettlement() {
            if(players.length === 0) return;
            const avg = players.reduce((s, p) => s + p.total, 0) / players.length;
            let debtors = players.filter(p => p.total < avg).map(p => ({...p, d: avg - p.total}));
            let creditors = players.filter(p => p.total >= avg).map(p => ({...p, d: p.total - avg}));
            let html = "";
            debtors.forEach(d => {
                creditors.forEach(c => {
                    if (d.d > 0.1 && c.d > 0.1) {
                        const amt = Math.min(d.d, c.d);
                        html += `<div>${d.name}→${c.name}:${amt.toFixed(1)}pt</div>`;
                        d.d -= amt; c.d -= amt;
                    }
                });
            });
            document.getElementById('settlement-result').innerHTML = html || "精算不要";
        }

        function resetData() { if(confirm("全リセット？")) { localStorage.clear(); location.reload(); } }
        setMode('input');
    </script>
</body>
</html>
