<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TRUMP RATING SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #FFD700; font-family: 'Roboto Condensed', sans-serif; margin: 0; padding: 10px; text-transform: uppercase; }
        h1 { border-bottom: 3px solid #FFD700; text-align: center; margin-bottom: 20px; }
        .mode-btn { width: 48%; padding: 15px; border: 2px solid #FFD700; background: #000; color: #FFD700; font-weight: bold; }
        
        /* 入力用パネル */
        .rank-panel { background: #1a1a1a; padding: 20px; margin-top: 10px; border: 2px solid #FFD700; }
        .rank-btn { width: 23%; padding: 20px 5px; background: #FFD700; border: none; font-weight: bold; }
        
        /* テーブル */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; border: 2px solid #FFD700; }
        th, td { border: 1px solid #FFD700; padding: 10px; text-align: center; }
        
        .big-btn { width: 100%; padding: 20px; background: #FFD700; color: #000; font-weight: bold; border: none; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>TRUMP SYSTEM</h1>
    <div style="display:flex; gap:4px; margin-bottom:20px;">
        <button class="mode-btn" onclick="show('input')">1. INPUT RESULT</button>
        <button class="mode-btn" onclick="show('table')">2. TABLE & SETTLE</button>
    </div>

    <div id="inputArea" class="input-area">
        <div id="inputList"></div>
    </div>

    <div id="tableArea" class="table-area hidden">
        <div class="rule-box" style="font-size:0.8rem; border:1px solid #FFD700; padding:10px;">
            順位に応じ(20,10,10,0)pt配分。不参加者は平均ptを加算。
        </div>
        <table id="scoreTable">
            <thead><tr><th>NAME</th><th>PLAY</th><th>PT</th></tr></thead>
            <tbody></tbody>
        </table>
        <button class="big-btn" style="background:transparent; color:#FFD700; border:2px solid #FFD700;" onclick="calculateSettlement()">CALCULATE SETTLEMENT</button>
        <div id="settlementResult" style="margin-top:20px; padding:10px; border:1px solid #FFD700;"></div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('data')) || [];
        let currentRank = 0;
        const POINTS = [20, 10, 10, 0];

        // プレイヤー追加、記録等の関数は以前と同じ
        function addPlayer() { /* ... */ }

        // 順位入力UIを動的に生成
        function renderInput() {
            document.getElementById('inputList').innerHTML = `
                <h3>現在、${currentRank+1}位のプレイヤーを選択</h3>
                ${players.map((p,i) => `
                    <button class="big-btn" onclick="record(${i})">${p.name}</button>
                `).join('')}
                <button class="big-btn" style="background:#444;" onclick="record(-1)">休みの人</button>
            `;
        }

        function record(idx) {
            if (currentRank < 4) {
                if (idx >= 0) players[idx].total += POINTS[currentRank];
                currentRank++;
                if (currentRank >= 4) { alert("終了！"); currentRank = 0; }
                renderInput();
            }
        }

        function show(m) {
            document.getElementById('inputArea').style.display = m==='input'?'block':'none';
            document.getElementById('tableArea').style.display = m==='table'?'block':'none';
        }
        
        renderInput(); // 初期化
    </script>
</body>
</html>
