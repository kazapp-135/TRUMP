<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TRUMP RATING SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=stylesheet">
    <style>
        body { background: #000; color: #FFD700; font-family: 'Roboto Condensed', sans-serif; margin: 0; padding: 20px; text-transform: uppercase; }
        h1 { border-bottom: 3px solid #FFD700; text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
        
        /* 縦長レイアウト */
        .mode-container { display: flex; flex-direction: column; gap: 10px; }
        .mode-btn { width: 100%; padding: 20px; border: 2px solid #FFD700; background: #000; color: #FFD700; font-weight: bold; font-size: 1.2rem; }
        
        .player-row { padding: 15px; border-bottom: 1px solid #333; display: flex; align-items: center; font-size: 1.2rem; }
        input[type="checkbox"] { transform: scale(1.5); margin-right: 15px; }
        
        .big-btn { width: 100%; padding: 25px; background: #FFD700; color: #000; border: none; font-weight: bold; font-size: 1.2rem; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #FFD700; padding: 15px; text-align: center; }
        
        .rule-box { border: 1px solid #FFD700; padding: 15px; margin: 20px 0; font-size: 0.9rem; line-height: 1.4; }
        .input-area, .table-area { display: none; }
    </style>
</head>
<body>
    <h1>TRUMP SYSTEM</h1>
    <div class="mode-container">
        <button class="mode-btn" onclick="show('input')">INPUT MODE</button>
        <button class="mode-btn" onclick="show('table')">TABLE MODE</button>
    </div>

    <div id="inputArea" class="input-area">
        <div style="margin: 20px 0;">
            <input type="text" id="pName" placeholder="PLAYER NAME" style="width:100%; padding:15px; box-sizing:border-box; background:#222; border:1px solid #FFD700; color:#FFD700; font-size:1.2rem;">
            <button class="big-btn" onclick="addPlayer()">+ ADD PLAYER</button>
        </div>
        <div id="inputList"></div>
    </div>

    <div id="tableArea" class="table-area">
        <div class="rule-box">
            計算の仕組み: 参加者は順位に応じたPT(20,10,10,0)を加算。不参加者はその回の参加者の平均PTが加算されます。
        </div>
        <table id="scoreTable">
            <thead><tr><th>NAME</th><th>PLAY</th><th>PT</th></tr></thead>
            <tbody></tbody>
        </table>
        <button class="big-btn" style="background:transparent; border:2px solid #FFD700; color:#FFD700;" onclick="calculateSettlement()">CALCULATE SETTLEMENT</button>
        <div id="settlementResult" style="margin-top:20px; border:1px solid #FFD700; padding:15px; font-size:1.2rem;"></div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('data')) || [];
        const POINTS = [20, 10, 10, 0];

        function addPlayer() {
            let n = document.getElementById('pName').value;
            if(n) { players.push({name:n, total:0, count:0}); save(); render(); }
        }

        function record() {
            let active = players.filter(p => p.selected);
            if(active.length === 0) return;
            let pts = POINTS.slice(0, active.length);
            let avg = pts.reduce((a,b)=>a+b, 0) / active.length;
            players.forEach(p => {
                if(p.selected) { p.total += pts.shift() || 0; p.count += 1; }
                else { p.total += avg; }
            });
            players.forEach(p => p.selected = false);
            save(); render();
        }

        function calculateSettlement() {
            let avg = players.reduce((s,p) => s + p.total, 0) / players.length;
            let bals = players.map(p => ({ n: p.name, b: Math.round(p.total - avg) }));
            let d = bals.filter(b => b.b < 0).sort((a,b) => a.b - b.b);
            let c = bals.filter(b => b.b > 0).sort((a,b) => b.b - a.b);
            let res = "";
            let i=0, j=0;
            while(i < d.length && j < c.length) {
                let amt = Math.min(-d[i].b, c[j].b);
                res += `<div style="padding:5px;">${d[i].n} → ${c[j].n} : ${amt} PT</div>`;
                d[i].b += amt; c[j].b -= amt;
                if(d[i].b === 0) i++; if(c[j].b === 0) j++;
            }
            document.getElementById('settlementResult').innerHTML = res || "精算不要";
        }

        function show(m) {
            document.getElementById('inputArea').style.display = m==='input'?'block':'none';
            document.getElementById('tableArea').style.display = m==='table'?'block':'none';
        }

        function save() { localStorage.setItem('data', JSON.stringify(players)); }

        function render() {
            document.getElementById('inputList').innerHTML = players.map((p,i) => `
                <div class="player-row">
                    <input type="checkbox" onchange="players[${i}].selected=this.checked"> ${p.name}
                </div>`).join('') + `<button class="big-btn" onclick="record()">SET RESULT (1ST-4TH)</button>`;
            document.querySelector('#scoreTable tbody').innerHTML = players.map(p => `
                <tr><td>${p.name}</td><td>${p.count}</td><td>${Math.round(p.total)}</td></tr>`).join('');
        }
        render();
    </script>
</body>
</html>
